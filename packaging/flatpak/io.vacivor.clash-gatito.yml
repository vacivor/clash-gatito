app-id: io.vacivor.clash-gatito
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: clash-gatito
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=session-bus
  - --share=network
  - --filesystem=xdg-config/clash-gatito:create
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/gtk-doc
  - /share/man
modules:
  - ../../shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  - name: clash-gatito
    buildsystem: simple
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/clash-gatito /app/bin/clash-gatito
      - install -Dm644 tray_icon.png /app/share/clash-gatito/tray_icon.png
      - install -Dm644 app_icon.png /app/share/clash-gatito/app_icon.png
      - install -Dm644 app_icon.svg /app/share/icons/hicolor/scalable/apps/io.vacivor.clash-gatito.svg
      - install -Dm644 packaging/flatpak/io.vacivor.clash-gatito.desktop /app/share/applications/io.vacivor.clash-gatito.desktop
      - install -Dm644 packaging/flatpak/io.vacivor.clash-gatito.metainfo.xml /app/share/metainfo/io.vacivor.clash-gatito.metainfo.xml
    sources:
      - type: dir
        path: ../..
